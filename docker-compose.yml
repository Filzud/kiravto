# docker compose up — сборщик по расписанию, бот модерации, HTTP API. Общая база в ./data.
# Секреты — только в .env (создаётся командой `python -m kiravto secrets`).
# Прокси для Telegram внутри контейнера — не 127.0.0.1 (это сам контейнер), а http://host.docker.internal:10809.
# HTML-отчёт: docker compose cp collector:/app/data/report.html ./report.html
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  # перекрывают .env: 127.0.0.1 в контейнере — сам контейнер. Сборщик тоже пишет в Telegram (оповещения, модерация)
  environment:
    TG_PROXY: ${TG_PROXY_DOCKER:-http://host.docker.internal:10809}
    LLM_PROXY: ${LLM_PROXY_DOCKER:-http://host.docker.internal:10809}
  volumes:
    # именованный том, а не папка хоста: SQLite в режиме WAL ненадёжен на bind-mount Docker Desktop (Windows/Mac)
    - kiravto-data:/app/data
    # ключ сервисного аккаунта для Google Таблицы (scripts/setup_gsheets.ps1), только чтение; папки может не быть
    - ./secrets:/app/secrets:ro
    # модель распознавания речи скачивается один раз и переживает пересборку образа
    - kiravto-models:/root/.cache/huggingface
  restart: unless-stopped

services:
  collector:
    <<: *app
    command: ["python", "-m", "kiravto", "collector"]
    shm_size: 512m

  bot:
    <<: *app
    command: ["python", "-m", "kiravto", "bot"]
    depends_on: [collector]

  api:
    <<: *app
    command: ["python", "-m", "kiravto", "api", "--port", "8080"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 60s
      timeout: 5s

  tests:
    <<: *app
    profiles: ["test"]
    restart: "no"
    command: ["python", "-m", "pytest", "-q"]

volumes:
  kiravto-data:
  kiravto-models:
