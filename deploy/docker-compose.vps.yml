# VPS: docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml up -d
# Отличия от локального запуска:
# * бота нет — на одном токене может работать только один бот (getUpdates), он остаётся на основной машине;
# * API слушает только 127.0.0.1: порт наружу не открывается, ufw не трогаем; доступ — ssh -L 8080:127.0.0.1:8080 vps;
# * прокси не нужен — сервер ходит в интернет напрямую;
# * распознавание речи выключено (нет бота, и памяти 2 ГБ).
# имя проекта явно: иначе compose берёт имя папки (app), и образы называются app-*, а откат ищет kiravto-*
name: kiravto

x-vps-env: &vps-env
  TG_PROXY: ""
  LLM_PROXY: ""
  STT_MODEL: "off"

services:
  collector:
    environment: *vps-env
  api:
    environment: *vps-env
    ports: !override
      - "127.0.0.1:8080:8080"
  bot:
    profiles: ["disabled"]
